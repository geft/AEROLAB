name: Release Windows Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run automated test suite
        run: npm test

      - name: Auto-version release build
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            RELEASE_VER="${GITHUB_REF_NAME#v}"
          else
            RELEASE_VER="1.0.${{ github.run_number }}"
          fi
          echo "Setting package version to $RELEASE_VER"
          npm version "$RELEASE_VER" --no-git-tag-version --allow-same-version

      - name: Build frontend and backend bundles
        run: npm run build:all

      - name: Package Windows Executable with electron-builder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AEROLAB-Windows-Build-${{ github.run_number }}
          path: release/*.exe

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          files: release/*.exe
          draft: false
          prerelease: false
          generate_release_notes: true
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('AEROLAB Windows Release {0}', github.ref_name) || format('AEROLAB Windows Build v1.0.{0}', github.run_number) }}
