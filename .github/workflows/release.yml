name: Release Windows Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (leave empty for an automatic build version)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-and-package:
    runs-on: windows-latest
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run automated test suite
        run: npm test

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Check translation references
        run: npm run i18n:unused

      - name: Auto-version release build
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            RELEASE_VER="${GITHUB_REF_NAME#v}"
          elif [[ -n "$REQUESTED_VERSION" ]]; then
            RELEASE_VER="${REQUESTED_VERSION#v}"
          else
            # Default: bump the patch of the newest v* tag (v1.5.0 -> 1.5.1)
            # rather than a fixed 1.1.<run_number>, which falls behind real tags.
            LATEST_TAG="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
            if [[ -z "$LATEST_TAG" ]]; then
              RELEASE_VER="1.0.0"
            else
              BASE_VER="${LATEST_TAG#v}"
              IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VER"
              if [[ ! "$MAJOR" =~ ^[0-9]+$ || ! "$MINOR" =~ ^[0-9]+$ || ! "$PATCH" =~ ^[0-9]+$ ]]; then
                echo "::error::Newest tag '$LATEST_TAG' is not a plain MAJOR.MINOR.PATCH version."
                exit 1
              fi
              RELEASE_VER="$MAJOR.$MINOR.$((PATCH + 1))"
            fi
          fi
          if [[ ! "$RELEASE_VER" =~ ^[0-9A-Za-z._-]+$ ]]; then
            echo "::error::Release tag version '$RELEASE_VER' contains characters that cannot go into the installer filename. Use only [0-9A-Za-z._-]."
            exit 1
          fi
          echo "Setting package version to $RELEASE_VER"
          npm version "$RELEASE_VER" --no-git-tag-version --allow-same-version
          echo "RELEASE_VERSION=$RELEASE_VER" >> "$GITHUB_ENV"
          echo "release_version=$RELEASE_VER" >> "$GITHUB_OUTPUT"

      - name: Package Chromium-Free Windows Distribution (Zero Terminal)
        run: node scripts/package-chromium-free.js

      - name: Smoke test packaged backend
        run: npm run smoke:packaged

      - name: Prepare changelog for release
        run: node scripts/write-release-notes.js

      - name: Upload Windows Build Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AEROLAB-Windows-Installer-${{ env.RELEASE_VERSION }}
          path: |
            release/AEROLAB-Setup-v${{ env.RELEASE_VERSION }}.exe
            release/release-notes.md

  publish:
    needs: build-and-package
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: AEROLAB-Windows-Installer-${{ needs.build-and-package.outputs.release_version }}
          path: release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ format('v{0}', needs.build-and-package.outputs.release_version) }}
          target_commitish: ${{ github.sha }}
          body_path: release/release-notes.md
          files: release/AEROLAB-Setup-v${{ needs.build-and-package.outputs.release_version }}.exe

          draft: false
          prerelease: false
          generate_release_notes: true
          name: ${{ format('AEROLAB Windows Release v{0}', needs.build-and-package.outputs.release_version) }}
